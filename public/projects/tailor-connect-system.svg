<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TailorConnect — Tailor &amp; Designer Marketplace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbd39" />
      <stop offset="100%" stop-color="#ffd97a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- dress shirt -->
  <g transform="translate(150 120)">
    <path d="M 160 30 L 60 70 L 60 170 L 120 240 L 120 400 L 200 400 L 200 240 L 260 170 L 260 70 L 160 30 Z" fill="#ffbd39" />
    <path d="M 160 30 L 120 90 L 160 120 L 200 90 L 160 30 Z" fill="#1a1a1a" opacity="0.55" />
    <path d="M 160 120 L 160 400" stroke="#1a1a1a" stroke-width="4" opacity="0.5" />
    <circle cx="160" cy="30" r="14" fill="#1a1a1a" />
  </g>

  <!-- scissors -->
  <g transform="translate(520 170)">
    <path d="M 60 40 C 90 10 130 10 150 30 L 90 90 Z" fill="none" stroke="#ffbd39" stroke-width="8" stroke-linecap="round" />
    <path d="M 60 150 C 90 180 130 180 150 160 L 90 100 Z" fill="none" stroke="#ffbd39" stroke-width="8" stroke-linecap="round" />
    <circle cx="150" cy="30" r="22" fill="none" stroke="#ffbd39" stroke-width="6" />
    <circle cx="150" cy="160" r="22" fill="none" stroke="#ffbd39" stroke-width="6" />
    <circle cx="112" cy="60" r="8" fill="#ffbd39" />
    <circle cx="112" cy="130" r="8" fill="#ffbd39" />
  </g>

  <!-- needle with thread -->
  <g transform="translate(760 240)">
    <path d="M 60 0 L 60 200" stroke="#ffbd39" stroke-width="5" />
    <ellipse cx="60" cy="6" rx="8" ry="5" fill="none" stroke="#ffbd39" stroke-width="3" />
    <path d="M 60 6 C 70 -10 90 -12 104 -4" stroke="#ffbd39" stroke-width="3" fill="none" />
    <path d="M 104 -4 C 110 -2 108 6 100 4" stroke="#ffbd39" stroke-width="3" fill="none" />
  </g>

  <!-- fabric rolls -->
  <g transform="translate(880 280)">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="#ffbd39" />
    <rect x="0" y="40" width="70" height="26" rx="13" fill="none" stroke="#ffbd39" stroke-width="4" />
    <rect x="0" y="80" width="70" height="26" rx="13" fill="none" stroke="#ffbd39" stroke-width="4" opacity="0.6" />
    <rect x="0" y="120" width="70" height="26" rx="13" fill="none" stroke="#ffbd39" stroke-width="4" opacity="0.35" />
  </g>

  <!-- chat bubbles (real-time chat) -->
  <g transform="translate(200 470)">
    <rect x="0" y="0" width="240" height="44" rx="20" fill="#2a2416" stroke="#ffbd39" stroke-width="2" />
    <circle cx="34" cy="22" r="12" fill="#ffbd39" />
    <text x="70" y="28" font-size="16" font-family="sans-serif" fill="#fff">Home visit booked</text>
  </g>
  <g transform="translate(560 520)">
    <rect x="0" y="0" width="200" height="44" rx="20" fill="#1f2833" stroke="#2e3b4e" stroke-width="2" />
    <text x="34" y="28" font-size="16" font-family="sans-serif" fill="#d3d3d3">Measuring in 2 hrs</text>
  </g>
  <text x="980" y="520" font-size="17" font-family="monospace" fill="#7fd07f">● chat online</text>
</svg>
