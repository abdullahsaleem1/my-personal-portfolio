<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distributed Inventory &amp; Order Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbd39" />
      <stop offset="100%" stop-color="#ffd97a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- warehouse shelves -->
  <g fill="none" stroke="#3a3a3a" stroke-width="6">
    <line x1="180" y1="210" x2="720" y2="210" />
    <line x1="180" y1="350" x2="720" y2="350" />
    <line x1="180" y1="490" x2="720" y2="490" />
    <line x1="180" y1="210" x2="180" y2="520" />
    <line x1="450" y1="210" x2="450" y2="520" />
    <line x1="720" y1="210" x2="720" y2="520" />
  </g>

  <!-- boxes top shelf -->
  <g fill="#ffbd39">
    <rect x="200" y="140" width="80" height="68" rx="6" />
    <rect x="305" y="128" width="80" height="80" rx="6" />
    <rect x="470" y="148" width="80" height="60" rx="6" opacity="0.85" />
    <rect x="575" y="136" width="80" height="72" rx="6" />
  </g>
  <g fill="none" stroke="#1c1c1c" stroke-width="3" opacity="0.5">
    <path d="M 220 140 L 240 170 L 220 190 M 260 140 L 260 190" />
  </g>

  <!-- boxes middle shelf -->
  <g fill="none" stroke="#ffbd39" stroke-width="4">
    <rect x="210" y="262" width="90" height="86" rx="6" />
    <rect x="320" y="276" width="90" height="72" rx="6" />
    <rect x="560" y="262" width="90" height="86" rx="6" />
  </g>

  <!-- bottom boxes filled -->
  <g fill="#2b2b2b" stroke="#ffbd39" stroke-width="4">
    <rect x="210" y="402" width="90" height="86" rx="6" />
    <rect x="320" y="402" width="90" height="86" rx="6" />
    <rect x="430" y="402" width="90" height="86" rx="6" opacity="0.5" />
    <rect x="540" y="402" width="90" height="86" rx="6" opacity="0.5" />
    <rect x="650" y="402" width="90" height="86" rx="6" opacity="0.3" />
  </g>

  <!-- conveyor of orders -->
  <g transform="translate(820 320)">
    <rect x="0" y="60" width="280" height="14" rx="7" fill="#333" />
    <rect x="0" y="60" width="280" height="14" rx="7" fill="none" stroke="#ffbd39" stroke-width="2" />
    <g fill="#ffbd39">
      <rect x="30" y="20" width="60" height="40" rx="5" />
      <rect x="120" y="8" width="60" height="52" rx="5" opacity="0.8" />
      <rect x="210" y="24" width="60" height="36" rx="5" opacity="0.6" />
    </g>
    <text x="30" y="45" font-size="16" font-family="monospace" font-weight="700" fill="#111" text-anchor="middle">#104</text>
    <text x="150" y="34" font-size="16" font-family="monospace" font-weight="700" fill="#111" text-anchor="middle">#105</text>
    <text x="240" y="48" font-size="16" font-family="monospace" font-weight="700" fill="#111" text-anchor="middle">#106</text>
  </g>

  <!-- status badge -->
  <g transform="translate(820 500)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#ffbd39" stroke-width="5" />
    <path d="M 14 28 L 24 38 L 42 18" fill="none" stroke="#ffbd39" stroke-width="5" stroke-linecap="round" />
    <text x="84" y="34" font-size="18" font-family="monospace" fill="#ffbd39">Order processed</text>
  </g>
</svg>
