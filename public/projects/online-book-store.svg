<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Online Book Store E-Commerce Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbd39" />
      <stop offset="100%" stop-color="#ffd97a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- open book -->
  <g transform="translate(200 180)">
    <!-- left page -->
    <path d="M 0 0 C 120 20 200 60 240 120 L 240 330 C 190 280 100 250 0 240 Z" fill="#ffbd39" />
    <path d="M 0 0 C 120 20 200 60 240 120 L 240 330 C 190 280 100 250 0 240 Z" fill="none" stroke="#1a1a1a" stroke-width="4" />
    <!-- right page -->
    <path d="M 240 120 C 280 60 360 20 480 0 L 480 240 C 380 250 290 280 240 330 Z" fill="#ffbd39" opacity="0.75" />
    <path d="M 240 120 C 280 60 360 20 480 0 L 480 240 C 380 250 290 280 240 330 Z" fill="none" stroke="#1a1a1a" stroke-width="4" />
    <!-- text lines -->
    <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0.45">
      <line x1="60" y1="70" x2="180" y2="70" />
      <line x1="50" y1="100" x2="200" y2="100" />
      <line x1="40" y1="130" x2="180" y2="130" />
      <line x1="300" y1="70" x2="420" y2="70" />
      <line x1="280" y1="100" x2="430" y2="100" />
      <line x1="290" y1="130" x2="440" y2="130" />
    </g>
  </g>

  <!-- stacked books -->
  <g transform="translate(740 300)">
    <rect x="0" y="200" width="220" height="46" rx="6" fill="#ffbd39" />
    <rect x="30" y="150" width="220" height="46" rx="6" fill="none" stroke="#ffbd39" stroke-width="4" />
    <rect x="10" y="100" width="220" height="46" rx="6" fill="none" stroke="#ffbd39" stroke-width="4" opacity="0.65" />
    <rect x="40" y="50" width="220" height="46" rx="6" fill="none" stroke="#ffbd39" stroke-width="4" opacity="0.35" />
  </g>

  <!-- shopping cart -->
  <g transform="translate(760 60)">
    <path d="M 20 40 L 40 40 L 56 110 L 150 110 L 170 40 Z" fill="none" stroke="#ffbd39" stroke-width="6" stroke-linejoin="round" />
    <path d="M 56 110 L 52 130 L 150 130" stroke="#ffbd39" stroke-width="6" fill="none" />
    <circle cx="80" cy="150" r="14" fill="#ffbd39" />
    <circle cx="130" cy="150" r="14" fill="#ffbd39" />
    <circle cx="35" cy="40" r="12" fill="none" stroke="#ffbd39" stroke-width="5" />
    <path d="M 28 34 A 22 22 0 0 1 42 34" fill="none" stroke="#ffbd39" stroke-width="4" />
  </g>

  <!-- price tag / checkout -->
  <g transform="translate(930 460)">
    <rect x="0" y="0" width="200" height="64" rx="10" fill="#161616" stroke="#ffbd39" stroke-width="2" />
    <text x="100" y="28" font-size="24" font-family="monospace" font-weight="700" fill="#ffbd39" text-anchor="middle">$14.99</text>
    <text x="100" y="50" font-size="14" font-family="sans-serif" fill="#888" text-anchor="middle">Checkout · JWT secured</text>
  </g>
  <path d="M 900 480 L 1030 480" stroke="#ffbd39" stroke-width="2" stroke-dasharray="8 8" opacity="0.5" />
</svg>
